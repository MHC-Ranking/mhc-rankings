<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <!-- MathJax for rendering equations -->
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    
    <style>
        :root {
            --primary-color: #0f204b; /* Deep Navy */
            --secondary-color: #a3aaaf; /* Silver/Gray */
            --accent-color: #d11241; /* Sporty Red */
            --bg-color: #f4f6f8;
            --text-color: #333;
            --white: #ffffff;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            margin: 0;
            padding: 0;
        }

        header {
            background-color: var(--primary-color);
            color: var(--white);
            padding: 2rem 0;
            text-align: center;
            border-bottom: 5px solid var(--accent-color);
        }

        h1, h2, h3, h4 {
            color: var(--primary-color);
        }

        header h1 {
            margin: 0;
            font-size: 2.5rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--white);
        }

        h2 {
            border-bottom: 2px solid var(--secondary-color);
            padding-bottom: 0.5rem;
            margin-top: 2rem;
        }

        /* Layout */
        .page-wrapper {
            display: flex;
            max-width: 1400px;
            margin: 0 auto;
        }

        .sidebar {
            width: 300px;
            flex-shrink: 0;
            position: sticky;
            top: 0;
            height: 100vh;
            overflow-y: auto;
            padding: 2rem 1rem;
            background-color: var(--white);
            border-right: 1px solid #ddd;
            box-sizing: border-box;
        }

        .sidebar h3 {
            margin-top: 0;
            border-bottom: 1px solid var(--secondary-color);
            padding-bottom: 10px;
        }

        .content {
            flex: 1;
            padding: 2rem 3rem;
            background-color: var(--white);
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin: 2rem;
            border-radius: 8px;
            min-width: 0; /* Prevents flex items from overflowing */
        }

        /* Table of Contents */
        .toc-list {
            list-style: none;
            padding-left: 0;
            margin: 0;
        }

        .toc-item {
            margin-bottom: 0.25rem;
        }

        .toc-link {
            text-decoration: none;
            color: var(--text-color);
            display: block;
            padding: 0.35rem 0.75rem;
            border-left: 3px solid transparent;
            transition: all 0.2s;
            border-radius: 0 4px 4px 0;
        }

        .toc-link:hover {
            background-color: var(--bg-color);
        }

        .toc-link.active {
            color: var(--accent-color);
            font-weight: 600;
            border-left-color: var(--accent-color);
            background-color: var(--bg-color);
        }

        .toc-level-1 { margin-left: 0; font-weight: 600; margin-top: 0.75rem; }
        .toc-level-2 { margin-left: 1rem; font-size: 0.95em; }
        .toc-level-3 { margin-left: 2rem; font-size: 0.85em; }

        /* Tables inside content */
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 1.5rem 0;
            font-size: 0.95rem;
        }

        th, td {
            padding: 12px 15px;
            text-align: left;
            border: 1px solid #ddd;
        }

        th {
            background-color: var(--primary-color);
            color: var(--white);
            font-weight: 600;
        }

        tbody tr:nth-of-type(even) {
            background-color: #f9f9f9;
        }
        
        tbody tr:hover {
            background-color: #f1f1f1;
        }

        /* Code & blockquotes */
        code {
            background-color: #e9ecef;
            padding: 0.2rem 0.4rem;
            border-radius: 3px;
            font-family: monospace;
            font-size: 0.9em;
        }

        pre code {
            display: block;
            padding: 1rem;
            overflow-x: auto;
            background-color: #2b2b2b;
            color: #f8f8f2;
        }

        blockquote {
            border-left: 4px solid var(--accent-color);
            margin: 1.5rem 0;
            padding: 0.5rem 1rem;
            background-color: #f8f9fa;
            color: #555;
            font-style: italic;
        }
        
        img {
            max-width: 100%;
            height: auto;
        }

        details {
            border: 1px solid #ddd;
            border-radius: 4px;
            padding: 0.5rem 1rem;
            margin: 1.5rem 0;
        }

        summary {
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <header>
        <h1>{{ title }}</h1>
    </header>

    <div class="page-wrapper">
        <nav class="sidebar">
            <h3>Table of Contents</h3>
            <ul class="toc-list" id="toc">
                {% for item in toc %}
                <li class="toc-item toc-level-{{ item.level }}">
                    <a href="#{{ item.slug }}" class="toc-link">{{ item.title }}</a>
                </li>
                {% endfor %}
            </ul>
        </nav>

        <main class="content" id="main-content">
            {{ html_content | safe }}
        </main>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const tocLinks = document.querySelectorAll('.toc-link');
            const headings = Array.from(document.querySelectorAll('main h1, main h2, main h3, main h4, main h5, main h6')).filter(h => h.id);

            // Headings inside a collapsed <details> are hidden, so open it when its TOC link is used.
            tocLinks.forEach(link => link.addEventListener('click', () => {
                const target = document.getElementById(link.getAttribute('href').slice(1));
                for (let d = target && target.closest('details'); d; d = d.parentElement.closest('details')) {
                    d.open = true;
                }
            }));
            
            function onScroll() {
                let currentId = '';
                // 150px offset to trigger active state slightly before hitting the top
                const scrollPosition = window.scrollY + 150;
                const visible = headings.filter(h => h.offsetParent !== null);
                
                for (let i = 0; i < visible.length; i++) {
                    const heading = visible[i];
                    // Calculate element's absolute position on page
                    const headingTop = heading.getBoundingClientRect().top + window.scrollY;
                    
                    if (scrollPosition >= headingTop) {
                        currentId = heading.id;
                    } else {
                        break;
                    }
                }
                
                // If scrolled to very bottom, select the last item
                if ((window.innerHeight + Math.round(window.scrollY)) >= document.body.offsetHeight - 10) {
                    if (visible.length > 0) {
                        currentId = visible[visible.length - 1].id;
                    }
                }
                
                if (currentId) {
                    tocLinks.forEach(link => {
                        link.classList.remove('active');
                        if (link.getAttribute('href') === '#' + currentId) {
                            link.classList.add('active');
                        }
                    });
                } else if (headings.length > 0) {
                    // Default to first item if at top
                    tocLinks.forEach(link => link.classList.remove('active'));
                    const firstLink = document.querySelector(\`.toc-link[href="#\${headings[0].id}"]\`);
                    if (firstLink) firstLink.classList.add('active');
                }
            }
            
            window.addEventListener('scroll', onScroll);
            onScroll(); // Initialize on load
        });
    </script>
</body>
</html>
